<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>OpenStrudel</title>
  <style>
    :root { color-scheme: dark; --bg:#090a0f; --panel:rgba(30,31,39,.74); --panel-strong:rgba(46,47,57,.88); --line:rgba(255,255,255,.11); --muted:#9b9ca8; --text:#f4f4f7; --accent:#8b75ff; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0%,#272052 0,transparent 35%),radial-gradient(circle at 100% 100%,#162649 0,transparent 35%),var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif; }
    button,input,textarea { font:inherit; color:inherit } button { border:0; cursor:pointer } .app { display:flex; width:min(1240px,100%); min-height:100vh; margin:auto; padding:18px; gap:1px; }
    .sidebar,.conversation { border:1px solid var(--line); background:rgba(15,16,22,.76); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); }
    .sidebar { width:260px; border-radius:24px 0 0 24px; padding:14px 10px; display:flex; flex-direction:column; }
    .conversation { flex:1; min-width:0; border-radius:0 24px 24px 0; display:flex; flex-direction:column; overflow:hidden; }
    .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; font-weight:650; font-size:16px; } .mark { width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#b6b9ff,#6754db);box-shadow:0 6px 22px #6d5ae955; }
    .mark::after { content:'✦'; color:white; font-size:16px } .section-label { color:var(--muted); font-size:12px; padding:0 10px 7px; } .agent-list { display:flex; flex-direction:column; gap:3px; }
    .agent { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:13px; background:transparent; text-align:left; } .agent:hover { background:rgba(255,255,255,.07) } .agent.active { background:rgba(255,255,255,.12) }
    .avatar { width:33px;height:33px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#7984ff,#5142bd);font-weight:650;font-size:12px; } .avatar.employee { background:linear-gradient(135deg,#f5a86a,#cf5f69); }
    .agent-copy { min-width:0 } .agent-name { font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .agent-sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .side-bottom { margin-top:auto; display:flex; align-items:center; gap:8px; padding:10px 3px 0; } .status { flex:1; color:var(--muted); font-size:12px; } .status b { color:#69db9b; font-weight:500; } .icon { width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.06); } .icon:hover { background:rgba(255,255,255,.13); }
    .topbar { height:65px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center; position:relative; } .top-title { display:flex; align-items:center; gap:8px; font-weight:600; } .top-title small { color:var(--muted); font-weight:450; font-size:12px; } .top-actions { position:absolute; right:14px; display:flex; gap:8px; }
    .messages { flex:1; overflow:auto; padding:28px clamp(18px,6vw,84px); } .empty { min-height:100%; display:grid; place-items:center; text-align:center; } .empty h1 { margin:12px 0 5px; font-size:29px; letter-spacing:-.7px; } .empty p { max-width:390px; color:var(--muted); margin:0 auto; }
    .message-row { display:flex; margin:0 0 18px; } .message-row.user { justify-content:flex-end; } .bubble { max-width:min(720px,88%); padding:12px 15px; border-radius:19px; white-space:pre-wrap; overflow-wrap:anywhere; } .assistant .bubble { background:var(--panel); border:1px solid var(--line); } .user .bubble { background:linear-gradient(135deg,#7060e9,#5745c1); } .time { color:var(--muted); font-size:11px; margin:4px 5px 0; }
    .composer-wrap { padding:12px clamp(14px,5vw,72px) 16px; } .suggestions { display:flex; gap:7px; margin-bottom:9px; overflow:auto; } .chip { flex:none; color:var(--muted); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:999px; padding:7px 11px; font-size:12px; } .chip:hover { color:var(--text); }
    .composer { display:flex; align-items:flex-end; gap:9px; padding:9px 10px 9px 15px; background:var(--panel-strong); border:1px solid rgba(255,255,255,.14); border-radius:21px; box-shadow:0 12px 35px #0004; } textarea { flex:1; min-height:25px; max-height:130px; resize:none; border:0; outline:0; background:transparent; } .send { width:35px;height:35px;border-radius:50%;background:white;color:#1b1b24;font-weight:700; } .send:disabled { opacity:.35; }
    .modal-backdrop { position:fixed; inset:0; display:none; place-items:center; padding:20px; background:#0008; z-index:3; } .modal-backdrop.open { display:grid; } .modal { width:min(440px,100%); background:#202128f2; border:1px solid var(--line); border-radius:23px; padding:22px; box-shadow:0 25px 80px #0009; backdrop-filter:blur(34px); } .modal h2 { margin:0 0 7px; } .modal p { color:var(--muted); margin:0 0 18px; } .field { width:100%; padding:11px 12px; margin:6px 0; border:1px solid var(--line); border-radius:12px; background:#111219aa; outline:none; } .field:focus { border-color:#9889ff; } .modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:15px; } .primary,.secondary { padding:9px 14px; border-radius:11px; } .primary { background:#8474f4; color:white; } .secondary { background:rgba(255,255,255,.09); }
    @media (max-width:700px) { .app { padding:0; } .sidebar { display:none; } .conversation { border-radius:0; border:0; min-height:100vh; } .topbar { height:58px; } .messages { padding:20px 15px; } .composer-wrap { padding:10px 10px 12px; } }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><span class="mark"></span><span>OpenStrudel</span><button class="icon" id="new-employee" title="Новый сотрудник">＋</button></div>
      <div class="section-label">Сотрудники</div>
      <div class="agent-list" id="agents"></div>
      <div class="side-bottom"><div class="status" id="status">Подключение…</div><button class="icon" id="settings" title="Настройки">⚙</button></div>
    </aside>
    <section class="conversation">
      <header class="topbar"><div class="top-title"><span class="mark" style="width:26px;height:26px;border-radius:9px"></span><span id="active-name">OpenStrudel</span><small id="active-state">готов</small></div><div class="top-actions"><button class="icon" id="mobile-agents" title="Сотрудники">☷</button></div></header>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap"><div class="suggestions"><button class="chip">Собери план на сегодня</button><button class="chip">Помоги разобраться</button></div><form class="composer" id="composer"><textarea id="draft" rows="1" placeholder="Напишите, что нужно…"></textarea><button class="send" id="send" disabled>↑</button></form></div>
    </section>
  </main>
  <div class="modal-backdrop" id="modal"><div class="modal" id="modal-content"></div></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { profiles: [], selected: null, messages: [], telegram: null, loading: false };
    async function api(path, options = {}) { const response = await fetch(path, { headers: { 'content-type':'application/json', ...(options.headers || {}) }, ...options }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status)); return data; }
    function initials(name) { return name.split(/\s+/).map((part) => part[0]).join('').slice(0,2).toUpperCase(); }
    function renderAgents() { const root = $('agents'); root.replaceChildren(); const main = document.createElement('button'); main.className = 'agent' + (!state.selected ? ' active' : ''); main.innerHTML = '<span class="avatar">✦</span><span class="agent-copy"><span class="agent-name">OpenStrudel</span><span class="agent-sub">Главный собеседник</span></span>'; main.onclick = () => selectAgent(null); root.append(main); for (const profile of state.profiles) { const button = document.createElement('button'); button.className = 'agent' + (state.selected === profile.id ? ' active' : ''); button.innerHTML = `<span class="avatar employee">${initials(profile.name)}</span><span class="agent-copy"><span class="agent-name"></span><span class="agent-sub"></span></span>`; button.querySelector('.agent-name').textContent = profile.name; button.querySelector('.agent-sub').textContent = profile.instructions; button.onclick = () => selectAgent(profile.id); root.append(button); } }
    function renderMessages() { const root = $('messages'); root.replaceChildren(); if (!state.messages.length) { root.innerHTML = '<div class="empty"><div><span class="mark" style="width:62px;height:62px;border-radius:21px;display:inline-grid;font-size:28px"></span><h1>Что сделать?</h1><p>Пишите обычными словами. OpenStrudel сам выберет собеседника и передаст ему контекст.</p></div></div>'; return; } for (const message of state.messages) { const row = document.createElement('div'); row.className = 'message-row ' + (message.direction === 'inbound' ? 'user' : 'assistant'); const wrap = document.createElement('div'); const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = message.text; const time = document.createElement('div'); time.className = 'time'; time.textContent = new Date(message.createdAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); wrap.append(bubble,time); row.append(wrap); root.append(row); } root.scrollTop = root.scrollHeight; }
    async function loadConversation() { const path = state.selected ? '/v1/agents/' + encodeURIComponent(state.selected) + '/conversation' : '/v1/conversation'; const data = await api(path); state.messages = data.messages || []; renderMessages(); const profile = state.profiles.find((item) => item.id === state.selected); $('active-name').textContent = profile?.name || 'OpenStrudel'; $('active-state').textContent = profile ? 'сотрудник' : 'готов'; }
    async function selectAgent(id) { state.selected = id; renderAgents(); await loadConversation(); }
    async function refresh() { try { const [health, profiles, integrations] = await Promise.all([api('/health'), api('/v1/profiles'), api('/v1/integrations')]); state.profiles = profiles.profiles || []; state.telegram = integrations.telegram; $('status').innerHTML = health.ok ? '<b>●</b> готов' : 'ожидает'; renderAgents(); await loadConversation(); } catch (error) { $('status').textContent = error.message; } }
    $('draft').addEventListener('input', () => { $('send').disabled = !$('draft').value.trim(); $('draft').style.height = 'auto'; $('draft').style.height = Math.min($('draft').scrollHeight, 130) + 'px'; });
    document.querySelectorAll('.chip').forEach((chip) => chip.onclick = () => { $('draft').value = chip.textContent; $('draft').dispatchEvent(new Event('input')); $('draft').focus(); });
    $('composer').onsubmit = async (event) => { event.preventDefault(); const text = $('draft').value.trim(); if (!text || state.loading) return; state.loading = true; $('send').disabled = true; $('draft').value = ''; $('draft').dispatchEvent(new Event('input')); try { const result = await api('/v1/messages', { method:'POST', body: JSON.stringify({ channel:'api', externalChatId: 'home', profile: state.selected || undefined, text }) }); if (result.profileId && !state.selected) state.selected = result.profileId; await refresh(); } catch (error) { $('status').textContent = error.message; } finally { state.loading = false; $('send').disabled = !$('draft').value.trim(); } };
    $('new-employee').onclick = () => openEmployeeModal(); $('mobile-agents').onclick = () => openEmployeeModal(true); $('settings').onclick = () => openSettings();
    function showModal(content) { $('modal-content').replaceChildren(content); $('modal').classList.add('open'); } function closeModal() { $('modal').classList.remove('open'); } $('modal').onclick = (event) => { if (event.target === $('modal')) closeModal(); };
    function openEmployeeModal() { const box = document.createElement('div'); box.innerHTML = '<h2>Новый сотрудник</h2><p>Имя и одна ясная работа. Остальное сделает Codex.</p><input class="field" id="employee-name" placeholder="Например: Исследователь"><textarea class="field" id="employee-instructions" rows="4" placeholder="Чем он должен заниматься?"></textarea><div class="modal-actions"><button class="secondary" id="cancel">Закрыть</button><button class="primary" id="create">Создать</button></div>'; showModal(box); $('cancel').onclick = closeModal; $('create').onclick = async () => { const name = $('employee-name').value.trim(), instructions = $('employee-instructions').value.trim(); if (!name || !instructions) return; try { const result = await api('/v1/profiles', { method:'POST', body: JSON.stringify({ name, instructions }) }); state.profiles.push(result.profile); closeModal(); await selectAgent(result.profile.id); } catch (error) { $('status').textContent = error.message; } }; }
    function openSettings() { const telegram = state.telegram || {}; const box = document.createElement('div'); box.innerHTML = `<h2>Настройки</h2><p>Подключите Telegram к этому Home.</p><input class="field" id="telegram-token" type="password" placeholder="Токен Telegram-бота"><div class="modal-actions"><button class="secondary" id="cancel">Закрыть</button><button class="primary" id="connect">Подключить</button></div><p style="margin-top:18px;color:var(--muted)">${telegram.configured ? ('Подключён ' + (telegram.botUsername ? '@' + telegram.botUsername : 'бот')) : 'Telegram ещё не подключён.'}</p>`; showModal(box); $('cancel').onclick = closeModal; $('connect').onclick = async () => { const token = $('telegram-token').value.trim(); if (!token) return; try { await api('/v1/integrations/telegram', { method:'POST', body: JSON.stringify({ token }) }); closeModal(); await refresh(); } catch (error) { $('status').textContent = error.message; } }; }
    refresh();
  </script>
</body>
</html>
