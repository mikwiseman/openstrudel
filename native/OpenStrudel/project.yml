name: OpenStrudel
options:
  bundleIdPrefix: is.openstrudel
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ParakeetRuntime:
    path: ../Packages/ParakeetRuntime
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.0, pinned to the published immutable commit.
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: R4A779QVVY
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: 70
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  OpenStrudel iOS:
    dependencies:
      - package: ParakeetRuntime
    type: application
    platform: iOS
    entitlements:
      path: iOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.associated-domains:
          - applinks:waiwai.is
    info:
      path: iOS-Info.plist
      properties:
        CFBundleDisplayName: OpenStrudel
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: is.openstrudel.team
            UTTypeDescription: OpenStrudel backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [openstrudel]
              public.mime-type: application/vnd.openstrudel.team+json
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: is.openstrudel.connect
            CFBundleURLSchemes: [openstrudel]
        NSLocalNetworkUsageDescription: Connect to your Mac or server to open your assistants and conversations.
        NSCameraUsageDescription: Scan an OpenStrudel connection code to connect your devices.
        NSMicrophoneUsageDescription: Record speech and transcribe it with your chosen service.
        NSAppTransportSecurity:
          # Self-hosted Homes use a certificate carried in the one-use invite.
          # PinnedHomeSession validates the exact host, port and certificate;
          # HomeClient rejects remote HTTP and unpinned HTTPS.
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          # The paper from the first frame: no white flash before the home.
          UIColorName: CanvasColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/Dictation-LICENSE.txt
        buildPhase: resources
      - path: ../../public/localizations.json
        buildPhase: resources
      - path: Localizations
        buildPhase: resources
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.ios
      ASSETCATALOG_COMPILER_APPICON_NAME: iOSAppIcon
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Development
      PROVISIONING_PROFILE_SPECIFIER: OpenStrudel Development Links 20261017
      INFOPLIST_KEY_CFBundleDisplayName: OpenStrudel
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - OpenStrudel iOS UI Tests
  OpenStrudel iOS UI Tests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenStrudel iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      TEST_TARGET_NAME: OpenStrudel iOS
  OpenStrudel macOS:
    type: application
    platform: macOS
    dependencies:
      - package: ParakeetRuntime
      - package: Sparkle
        product: Sparkle
    info:
      path: macOS-Info.plist
      properties:
        CFBundleDisplayName: OpenStrudel
        SUFeedURL: https://waiwai.is/openstrudel/updates/appcast.xml
        NSLocalNetworkUsageDescription: Connect to your Mac or server to open your assistants and conversations.
        NSMicrophoneUsageDescription: Record speech and transcribe it with your chosen service.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: is.openstrudel.team
            UTTypeDescription: OpenStrudel backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [openstrudel]
              public.mime-type: application/vnd.openstrudel.team+json
        SUPublicEDKey: 1vr8F09jobPqwo22O0M7Sm3PNuLP1GmGsJopfN6rX7U=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUSendProfileInfo: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: is.openstrudel.connect
            CFBundleURLSchemes: [openstrudel]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/Dictation-LICENSE.txt
        buildPhase: resources
      - path: ../../public/localizations.json
        buildPhase: resources
      - path: Localizations
        buildPhase: resources
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
      - path: Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: ../../scripts/server-setup.sh
        buildPhase: resources
      - path: ../../scripts/agentmetal-firewall.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.mac
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: OpenStrudel
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: OpenStrudel
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - OpenStrudel Text Tests
  OpenStrudel Text Tests:
    dependencies:
      - package: ParakeetRuntime
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/MessagePages.swift
      - path: Sources/MessageContent.swift
      - path: Sources/AppTheme.swift
      - path: Sources/ChatMedia.swift
      - path: Sources/AttachmentImport.swift
      - path: Sources/ComposerTextField.swift
      - path: Sources/VoiceCapture.swift
      - path: Sources/SpeechSettingsView.swift
      - path: Sources/DictationAssets.swift
      - path: Sources/ParakeetModel.swift
      - path: Sources/ParakeetTranscriber.swift
      - path: Sources/Localization.swift
      - path: Resources/Dictation-LICENSE.txt
        buildPhase: resources
      - path: ../../public/localizations.json
        buildPhase: resources
      - path: Sources/Models.swift
      - path: Sources/NewsDesk.swift
      - path: Sources/NewsPostText.swift
      - path: Sources/Team.swift
      - path: Sources/AgentAppearance.swift
      - path: Sources/HomeClient.swift
      - path: Sources/ConnectionDiagnostics.swift
      - path: Sources/DeviceLibrary.swift
      - path: Sources/ConversationReader.swift
      - path: Sources/ActivityModel.swift
      - path: Sources/CheckIns.swift
      - path: Sources/NeedsYou.swift
      - path: Sources/StatisticsModel.swift
      - path: Sources/ProjectSettingsModel.swift
      - path: Sources/HostingStore.swift
      - path: Sources/AgentTransfer.swift
      - path: Sources/EmployeeMove.swift
      - path: Sources/LocalHome.swift
      - path: Sources/LocalDataReset.swift
      - path: Sources/MobileConnection.swift
      - path: Sources/TelegramLink.swift
      - path: Sources/DigitalOceanBootstrap.swift
      - path: Sources/DigitalOceanCloud.swift
      - path: Sources/ServerSetup.swift
      - path: Sources/SSHConnectionReadiness.swift
      - path: Sources/WaiVDSContract.swift
      - path: Sources/AgentMetalCloud.swift
      - path: Sources/AgentMetalSetup.swift
      - path: Sources/WaiVDSClient.swift
      - path: ../../scripts/server-setup.sh
        buildPhase: resources
      - path: ../../scripts/agentmetal-firewall.sh
        buildPhase: resources
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.text-tests
      GENERATE_INFOPLIST_FILE: YES
