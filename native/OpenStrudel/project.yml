name: OpenStrudel
options:
  bundleIdPrefix: is.openstrudel
  # The interface is Russian, so system menus, buttons and errors are too.
  developmentLanguage: ru
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.0, pinned to the published immutable commit.
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: R4A779QVVY
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: 29
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  OpenStrudel iOS:
    type: application
    platform: iOS
    entitlements:
      path: iOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: iOS-Info.plist
      properties:
        CFBundleDisplayName: OpenStrudel
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: is.openstrudel.team
            UTTypeDescription: Команда OpenStrudel
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [openstrudel]
              public.mime-type: application/vnd.openstrudel.team+json
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: is.openstrudel.connect
            CFBundleURLSchemes: [openstrudel]
        NSLocalNetworkUsageDescription: Подключение к вашему Mac или серверу, чтобы открыть общие чаты и сотрудников.
        NSCameraUsageDescription: Сканирование приглашения OpenStrudel для подключения к вашим чатам.
        NSMicrophoneUsageDescription: Запись голосового сообщения. Распознавание происходит на этом устройстве.
        NSAppTransportSecurity:
          # Self-hosted Homes use a certificate carried in the one-use invite.
          # PinnedHomeSession validates the exact host, port and certificate;
          # HomeClient rejects remote HTTP and unpinned HTTPS.
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.ios
      CURRENT_PROJECT_VERSION: 29
      ASSETCATALOG_COMPILER_APPICON_NAME: iOSAppIcon
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Development
      PROVISIONING_PROFILE_SPECIFIER: OpenStrudel Development
      INFOPLIST_KEY_CFBundleDisplayName: OpenStrudel
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - OpenStrudel iOS UI Tests
  OpenStrudel iOS UI Tests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenStrudel iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      TEST_TARGET_NAME: OpenStrudel iOS
  OpenStrudel macOS:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: macOS-Info.plist
      properties:
        CFBundleDisplayName: OpenStrudel
        SUFeedURL: https://waiwai.is/openstrudel/updates/appcast.xml
        NSMicrophoneUsageDescription: Запись голосового сообщения. Распознавание происходит на этом Mac.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: is.openstrudel.team
            UTTypeDescription: Команда OpenStrudel
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [openstrudel]
              public.mime-type: application/vnd.openstrudel.team+json
        SUPublicEDKey: 1vr8F09jobPqwo22O0M7Sm3PNuLP1GmGsJopfN6rX7U=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUSendProfileInfo: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: is.openstrudel.connect
            CFBundleURLSchemes: [openstrudel]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
      - path: Resources/Sparkle-LICENSE.txt
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.mac
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: OpenStrudel
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: OpenStrudel
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - OpenStrudel Text Tests
  OpenStrudel Text Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/MessagePages.swift
      - path: Sources/MessageContent.swift
      - path: Sources/AppTheme.swift
      - path: Sources/ChatMedia.swift
      - path: Sources/AttachmentImport.swift
      - path: Sources/VoiceCapture.swift
      - path: Sources/Models.swift
      - path: Sources/AgentAppearance.swift
      - path: Sources/HomeClient.swift
      - path: Sources/DeviceLibrary.swift
      - path: Sources/HostingStore.swift
      - path: Sources/AgentTransfer.swift
      - path: Sources/LocalHome.swift
      - path: Sources/LocalDataReset.swift
      - path: Sources/MobileConnection.swift
      - path: Sources/TelegramLink.swift
      - path: Sources/DigitalOceanBootstrap.swift
      - path: Sources/DigitalOceanCloud.swift
      - path: Sources/WaiVDSContract.swift
      - path: Sources/WaiVDSClient.swift
      - path: ../../scripts/cloud-init.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: is.openstrudel.text-tests
      GENERATE_INFOPLIST_FILE: YES
